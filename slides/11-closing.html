<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>마치며</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0f1a; font-family: 'Noto Sans KR', sans-serif; color: #e6edf3; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; position: relative; overflow: hidden; }
.orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.35; z-index: 0; }
.orb1 { width: 460px; height: 460px; background: #7c3aed; top: -140px; left: -80px; }
.orb2 { width: 420px; height: 420px; background: #38bdf8; bottom: -140px; right: -60px; }
.container { width: 1280px; padding: 40px 80px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
.title { font-size: 46px; font-weight: 900; background: linear-gradient(135deg, #7c3aed, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 36px; line-height: 1.3; }
.cards { display: flex; gap: 24px; margin-bottom: 36px; width: 100%; }
.card { flex: 1; background: rgba(22,27,40,0.8); border: 1px solid rgba(139,148,158,0.12); border-radius: 18px; padding: 30px 26px; text-align: center; position: relative; overflow: hidden; opacity: 0; transform: translateY(24px); animation: cardIn 0.6s ease-out forwards; }
.card:nth-child(1) { animation-delay: 0.2s; } .card:nth-child(2) { animation-delay: 0.45s; } .card:nth-child(3) { animation-delay: 0.7s; }
@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.card:nth-child(1)::before { background: #7c3aed; } .card:nth-child(2)::before { background: #38bdf8; } .card:nth-child(3)::before { background: #7c3aed; }
.card-icon { font-size: 42px; margin-bottom: 14px; display: block; }
.card-name { font-size: 20px; font-weight: 900; margin-bottom: 10px; }
.card:nth-child(1) .card-name { color: #a78bfa; } .card:nth-child(2) .card-name { color: #7dd3fc; } .card:nth-child(3) .card-name { color: #a78bfa; }
.card-desc { font-size: 14px; color: #8b949e; line-height: 1.6; }
.conclusion { text-align: center; padding: 28px 44px; background: rgba(22, 27, 40, 0.6); border: 1px solid rgba(124, 58, 237, 0.2); border-radius: 16px; width: 100%; max-width: 980px; }
.conclusion-line { font-size: 26px; font-weight: 900; line-height: 1.6; background: linear-gradient(90deg, #7c3aed, #38bdf8); background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: gradient-shift 5s ease infinite; }
@keyframes gradient-shift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: rgba(10, 15, 26, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid rgba(124, 58, 237, 0.2); display: flex; align-items: center; justify-content: center; z-index: 9999; font-family: 'Noto Sans KR', sans-serif; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: #7c3aed; transition: color 0.2s; }
.slide-nav a:hover { color: #a78bfa; }
.slide-nav .nav-disabled { font-size: 14px; font-weight: 700; color: #484f58; cursor: default; }
.slide-nav .nav-center a { color: #8b949e; font-size: 13px; font-weight: 400; }
.slide-nav .nav-center a:hover { color: #e6edf3; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; }
body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="container">
  <h1 class="title">마치며</h1>
  <div class="cards">
    <div class="card"><span class="card-icon">🧩</span><div class="card-name">애로 사항</div><div class="card-desc">기준이 될 회사 형태를 하나로 정하지 못해, 폴더·문서·테이블 권한 모델을 여러 차례 재설계했습니다.</div></div>
    <div class="card"><span class="card-icon">💭</span><div class="card-name">아쉬운 점</div><div class="card-desc">초기의 흐릿한 방향성과 에이전트 구성의 미흡함. 기획·기술을 진행 중 보완해 나갔습니다.</div></div>
    <div class="card"><span class="card-icon">🚀</span><div class="card-name">향후 계획</div><div class="card-desc">평가 지표 자동화, 정량 목표치 수립, 그리고 실제 프로덕션 배포를 향해 나아갑니다.</div></div>
  </div>
  <div class="conclusion"><div class="conclusion-line">권한을 아는 사내 AI — 신뢰할 수 있어야 비로소 도입됩니다</div></div>
</div>

<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="10-risks.html" onclick="event.preventDefault(); navigateTo(this.href)">&larr; 이전</a></div>
    <div class="nav-center"><a href="index.html">11 / 11</a></div>
    <div class="nav-right"><span class="nav-disabled">다음 &rarr;</span></div>
  </div>
</nav>
<script>
function navigateTo(url){ document.body.classList.add('fade-out'); setTimeout(function(){ window.location.href=url; },300); }
document.addEventListener('keydown', function(e){ if(e.key==='ArrowLeft') navigateTo('10-risks.html'); });
</script>
</body>
</html>
