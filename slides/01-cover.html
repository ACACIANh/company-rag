<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>접근제어 에이전트 Friday</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0f1a;
  font-family: 'Noto Sans KR', sans-serif;
  color: #e6edf3;
  min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
  padding-bottom: 50px;
  position: relative; overflow: hidden;
}
.orb {
  position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.5; z-index: 0;
}
.orb1 { width: 480px; height: 480px; background: #7c3aed; top: -120px; left: -100px; }
.orb2 { width: 420px; height: 420px; background: #38bdf8; bottom: -120px; right: -80px; }
.container {
  width: 1280px; padding: 44px 80px;
  display: flex; flex-direction: column; align-items: center;
  position: relative; z-index: 1;
}
.eyebrow {
  font-size: 16px; font-weight: 700; letter-spacing: 4px; color: #8b949e;
  margin-bottom: 24px; text-transform: uppercase;
}
.title {
  font-size: 76px; font-weight: 900;
  background: linear-gradient(135deg, #7c3aed, #38bdf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-align: center; margin-bottom: 18px; line-height: 1.2;
}
.tagline { font-size: 24px; font-weight: 500; color: #c9d1d9; margin-bottom: 44px; text-align: center; }
.meta { display: flex; gap: 16px; margin-bottom: 28px; }
.meta-badge {
  padding: 12px 26px; border-radius: 30px;
  background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3);
  font-size: 16px; font-weight: 700; color: #a78bfa;
}
.footer-note { font-size: 15px; color: #484f58; }

.slide-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 50px;
  background: rgba(10, 15, 26, 0.95);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(124, 58, 237, 0.2);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; font-family: 'Noto Sans KR', sans-serif;
}
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: #7c3aed; transition: color 0.2s; }
.slide-nav a:hover { color: #a78bfa; }
.slide-nav .nav-disabled { font-size: 14px; font-weight: 700; color: #484f58; cursor: default; }
.slide-nav .nav-center a { color: #8b949e; font-size: 13px; font-weight: 400; }
.slide-nav .nav-center a:hover { color: #e6edf3; }

body { opacity: 0; animation: fadeIn 0.4s ease forwards; }
body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="container">
  <div class="eyebrow">사내 RAG · 접근제어 AI 에이전트</div>
  <h1 class="title">접근제어 에이전트<br>Friday</h1>
  <p class="tagline">사내 지식을 <strong>안전하게</strong> 묻고 답하는 AI — 출처 · 권한 · 안전을 더하다</p>
  <div class="meta">
    <span class="meta-badge">아카시아팀</span>
    <span class="meta-badge">2026.05.21 ~ 06.08</span>
    <span class="meta-badge">RAG + LangGraph 에이전트</span>
  </div>
  <p class="footer-note">AI Agent 기반 실무형 개발자 양성과정 · 수행 기획안</p>
</div>

<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><span class="nav-disabled">&larr; 이전</span></div>
    <div class="nav-center"><a href="index.html">01 / 11</a></div>
    <div class="nav-right"><a href="02-overview.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 &rarr;</a></div>
  </div>
</nav>
<script>
function navigateTo(url){ document.body.classList.add('fade-out'); setTimeout(function(){ window.location.href=url; },300); }
document.addEventListener('keydown', function(e){ if(e.key==='ArrowRight') navigateTo('02-overview.html'); });
</script>
</body>
</html>
