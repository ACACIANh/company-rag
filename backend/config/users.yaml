users:
  # admin: /admin 엔드포인트(재색인 등) 운영용. roles 는 앱 인증(admin API)용.
  # FGA 권한은 c_level 역할 → super_reader 로 전사 열람(private 포함).
  - username: admin
    password: admin123
    user_id: user-admin
    roles:
      - admin
      - user
    fga_roles:
      - c_level
  # alice: 엔지니어링 부서. 공개 문서 + /company/engineering/ops(private, eng 전용) 열람.
  - username: alice
    password: alice123
    user_id: user-alice
    roles:
      - user
    departments:
      - engineering
  # bob: 인사 부서. 공개 문서 + /company/hr(private, hr 전용) 열람.
  - username: bob
    password: bob123
    user_id: user-bob
    roles:
      - user
    departments:
      - hr
  # carol: 무소속. 전체공개(public) 문서만 열람, private 폴더는 차단.
  - username: carol
    password: carol123
    user_id: user-carol
    roles:
      - user
    departments: []
