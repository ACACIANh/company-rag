[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-rag-backend"
version = "0.1.0"
description = "LangGraph 기반 사내 RAG 챗봇 백엔드"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0,<3",
    "anthropic>=0.40,<1",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary,pool]>=3.1,<4",
    "asyncpg>=0.29,<1",
    "pgvector>=0.3,<1",
    "openfga-sdk>=0.10,<1",
    "sqlglot>=25.0,<27",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "PyJWT>=2.8,<3",
    "tavily-python>=0.5,<1",
    "duckduckgo-search>=6.0",
    "sentence-transformers>=2.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-mock>=3.0,<4",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.5",
    "locust>=2.29,<3",
]

[tool.setuptools.packages.find]
include = ["app*", "core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# scripts는 프로젝트 루트를 sys.path에 추가한 뒤 import하므로 E402(최상단 import)를 허용한다.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
